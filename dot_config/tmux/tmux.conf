set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"   # use homebrew path
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-interval 1    # make status bar more responsive
setw -g automatic-rename off


set -g mouse on
set -g status-position top  # place status bar at top rather than bottom
set -g base-index 1         # start indexing windows at 1 instead of 0
set -g pane-base-index 1    # start indexing panes at 1 instead of 0
set -g set-clipboard on     # use system clipboard
set -g renumber-windows on  # renumber all windows when any window is closed

unbind C-b

set-option -g prefix C-a

bind C-a send-prefix

unbind %
bind \\ split-window -h
unbind '"'
bind - split-window -v
unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
#set -sg escape-time 10

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
#set -g @catppuccin_pane_color "#{@thm_green}"
#set -g @catppuccin_pane_background_color "#{@thm_surface_0}"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text_color "#{@thm_mauve}"
set -g @catppuccin_window_text_color "#{@thm_blue}"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_text "#[fg=#{@thm_surface_0}]#W"
set -g @catppuccin_window_current_text "#[fg=#{@thm_surface_0}]#W"
set -g status-left ""
set -g status-right "#[fg=#f9e2af] #(basename \"#{pane_current_path}\") #[fg=#585b70]| #[bg=default,fg=#{@thm_green}]#[bg=#{@thm_green},fg=#{@thm_surface_0}]#{pane_index}:#{pane_current_command}#[bg=default,fg=#{@thm_green}]"
set -g @plugin 'omerxx/tmux-sessionx'

#set -g @resurrect-capture-pane-contents 'on'
#set -g @continuum-restore 'on'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
