# ~/.config/kitty/kitty.conf
# Shared config for macOS and Linux. Future improvement: convert to a
# chezmoi template (.tmpl) to vary font_size and background_opacity per OS.

include themes/catppuccin-macchiato.conf

font_family      MesloLGS Nerd Font
font_size        14

background_opacity        0.80
cursor_shape              block
cursor_blink_interval     0
confirm_os_window_close   0

# macOS-only options are silently ignored on Linux.
hide_window_decorations            titlebar-only
macos_quit_when_last_window_closed yes
