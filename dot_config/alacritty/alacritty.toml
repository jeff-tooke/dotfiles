# ~/.config/alacritty/alacritty.toml
# Shared config for macOS and Linux. Future improvement: convert to a
# chezmoi template (.tmpl) to vary font.size and window.opacity per OS.

[general]
import = ["~/.config/alacritty/themes/catppuccin-macchiato.toml"]

[font]
size = 14
normal = { family = "MesloLGS Nerd Font", style = "Regular" }
bold   = { family = "MesloLGS Nerd Font", style = "Bold" }
italic = { family = "MesloLGS Nerd Font", style = "Italic" }

[window]
opacity = 0.80
# macOS-only; ignored on Linux.
decorations = "Buttonless"

[cursor]
style = { shape = "Block", blinking = "Off" }
