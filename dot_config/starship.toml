# General
add_newline = false
format = "$all"
right_format = """${custom.kubernetes} ${custom.aws_profile} """
# right_format = """$custom.aws_profile $custom.kubernetes """

# Color Palette
palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

# Modules
[character]
success_symbol = "[ ❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold purple)"

[directory]
disabled = true
style = "blue"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "overlay0"
format = "([$all_status]($style)) "

[username]
style_user = "yellow"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
style = "green"
format = "on [$hostname]($style) "

[custom."kubernetes"]
command = '''
current_context=$(kubectl config current-context 2>/dev/null)
[ -z "$current_context" ] && exit 1

cluster_name=$(kubectl config view --minify --output=jsonpath="{.contexts[?(@.name==\"$current_context\")].context.cluster}" 2>/dev/null)

if [ -z "$cluster_name" ]; then
    cluster_name="$current_context"
fi

cleaned_cluster_name=$(echo "$cluster_name" | sed -E "s/^arn:aws:eks:[^:]+:[^:]+:cluster\\///; s/^gke_[^_]+_[^_]+_//; s/.*@//" | sed -E "s/-(cluster|context|kubeconfig)$//i; s/_(cluster|context|kubeconfig)$//i")

echo " $cleaned_cluster_name "
'''
when = '''[ -n "$(kubectl config current-context 2>/dev/null)" ]'''
symbol = "󱃾 "
format = "[$symbol$output]($style)"
style = "bold blue"

[custom."aws_profile"]
command = '''
profile="${AWS_VAULT:-$AWS_PROFILE}"

# Exit if no profile is set
[ -z "$profile" ] && exit 0

# Extract env and user from profile name
env=$(echo "$profile" | sed -E 's/^[^-]+-([^-]+-[^-]+)-\/.*/\1/')
env="${env%-}"
# user=$(echo "$profile" | sed -E 's/.*\/[^/]*-([^-]+)-user$/\1/')
# Extract the last segment (e.g. "team-admin-user")
last_segment=$(echo "$profile" | awk -F'/' '{print $NF}')

# Remove prefix and trailing "-user" or "-user-xyz" variants
user=$(echo "$last_segment" \
  | sed -E 's/^[^-]+-//' \
  | sed -E 's/-user$//')


# Exit if parsing failed
[ -z "$env" ] || [ -z "$user" ] && exit 0

label="${env}/${user}"

# Parse x_security_token_expires from credentials
creds_file=~/.aws/credentials
expires=$(awk -v p="[$profile]" '
  $0 == p {found=1}
  found && $1 == "x_security_token_expires" {print $3; exit}
' "$creds_file" 2>/dev/null)

if [ -n "$expires" ]; then
  expires_clean=$(echo "$expires" | sed 's/+00:00/Z/')
  expire_epoch=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$expires_clean" +%s 2>/dev/null)
  now_epoch=$(date +%s)
  diff=$((expire_epoch - now_epoch))

  if [ $diff -gt 0 ]; then
    minutes=$((diff / 60))
    time_left=$([ $minutes -gt 60 ] && echo "$((minutes / 60))h" || echo "${minutes}m")
    echo "$label ⏳$time_left"
  else
    echo "$label ❌"
  fi
else
  echo "$label"
fi
'''
when = '''[ -n "${AWS_PROFILE:-$AWS_VAULT}" ]'''
format = '[$output]($style)'
style = "peach bold"

[aws]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true
format = "[$symbol]($style)"

# [kubernetes]
# format = "[$symbol $cluster]($style) "

[lua]
format = "[$symbol]($style)"

[nodejs]
format = "[$symbol]($style)"

[python]
symbol = " "
style = "yellow"
format = "[$symbol$virtualenv]($style) "
python_binary = "python3"

[terraform]
format = "[$symbol]($style)"

[cmd_duration]
disabled = true

[line_break]
disabled = true
#disabled = false

[status]
style = "red"
symbol = "✖"
format = "[$symbol $status]($style) "
disabled = false
