# ~/.config/hypr/hyprpaper.conf
# Download a wallpaper to ~/.local/share/wallpapers/ first, e.g:
#   mkdir -p ~/.local/share/wallpapers
#   curl -sL https://raw.githubusercontent.com/catppuccin/wallpapers/main/os/arch-black-4k.png \
#     -o ~/.local/share/wallpapers/wallpaper.png
# Then adjust the path below to match.

preload = ~/.local/share/wallpapers/
wallpaper = Virtual-1, ~/.local/share/wallpapers/
